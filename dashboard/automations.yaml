- alias: "Generate Movie Cards"
  trigger:
    - platform: homeassistant
      event: start
  action:
    - service: python_script.generate_movie_cards
      target:
        entity_id: sensor.movies_alpha
    
- alias: "Render Movie Cards"
  trigger:
    - platform: homeassistant
      event: start
  action:
    - service: python_script.render_movies
      target:
        entity_id: sensor.movies_cards